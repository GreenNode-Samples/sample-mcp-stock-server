name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --select F,E9,B,UP,SIM --target-version py312 src tests

      - name: Tests (hermetic - no real network calls)
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t stock-mcp-server:ci .

      - name: Image runs as a non-root user and answers /health
        run: |
          docker run -d --name stock-mcp -e MCP_API_KEYS="$(openssl rand -hex 32)" -p 8080:8080 stock-mcp-server:ci
          test "$(docker exec stock-mcp id -u)" = "10001"
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          docker logs stock-mcp
          exit 1

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose - vServer default path works after `cp .env.example .env`
        working-directory: deploy/vserver
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Compose - vServer with the Caddy TLS override
        working-directory: deploy/vserver
        run: |
          cp .env.example .env
          CADDY_SITE=10.0.0.5 docker compose -f docker-compose.yml -f docker-compose.tls.yml config -q

      - name: Compose - on-prem
        working-directory: deploy/onprem
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Shellcheck
        run: shellcheck deploy/onprem/check_connectivity.sh
