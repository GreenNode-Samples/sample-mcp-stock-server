# Optional: only admit ingress to port 8080 from the AgentBase VPC (172.30.0.0/16).
# Needs a CNI that enforces NetworkPolicy. Note: if the load balancer / kube-proxy hides the source
# address (SNAT), the pod sees the LB / node IP instead of 172.30.0.0/16 -> add the CIDR of the
# LB / node subnet as another `ipBlock` below. Confirm the source-IP behaviour with GreenNode.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stock-mcp-allow-agentbase
  namespace: stock-mcp
spec:
  podSelector:
    matchLabels:
      app: stock-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 172.30.0.0/16
        # - ipBlock:
        #     cidr: xx.xx.x.x/xx   # subnet of the node / internal LB if SNAT applies
      ports:
        - protocol: TCP
          port: 8080
