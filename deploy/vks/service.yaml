# Service để MCP Gateway (Private) gọi vào từ AgentBase VPC.
# Cần một load balancer NỘI BỘ (internal) trong VPC của khách hàng — không public ra Internet.
apiVersion: v1
kind: Service
metadata:
  name: stock-mcp-server
  namespace: stock-mcp
  labels:
    app: stock-mcp-server
  # TODO: thêm annotation internal LB theo docs vLB/VKS của GreenNode
  # (annotation để tạo load balancer nội bộ / chọn subnet — KHÔNG tự đoán tên annotation).
  # annotations:
  #   <annotation-internal-lb>: "<giá-trị>"
spec:
  type: LoadBalancer
  selector:
    app: stock-mcp-server
  ports:
    - name: http
      port: 8080          # nếu đặt TLS ở LB/ingress: đổi thành 8443 và terminate TLS ở đó
      targetPort: http
      protocol: TCP

# ---------------------------------------------------------------------------
# Phương án thay thế: NodePort (dùng khi chưa có internal LB).
# Thay `type: LoadBalancer` ở trên bằng type: NodePort + nodePort, rồi trỏ connector tới
# IP private của node: http://<node-ip>:30080/mcp. Security group của node worker
# phải cho 172.30.0.0/16 vào cổng 30080.
#
#   spec:
#     type: NodePort
#     ports:
#       - name: http
#         port: 8080
#         targetPort: http
#         nodePort: 30080   # dải mặc định 30000-32767
# ---------------------------------------------------------------------------
