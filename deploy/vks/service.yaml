# Service that exposes the MCP server to the MCP Gateway (Private mode, AgentBase VPC 172.30.0.0/16).
#
# NodePort keeps the server on the private network: it is reachable at <node private IP>:30080 and
# nothing is published to the Internet by this manifest. Restrict port 30080 on the worker nodes'
# security group to 172.30.0.0/16 (and do not give the nodes public IPs).
#
# Do NOT switch this to `type: LoadBalancer` without an internal-load-balancer annotation taken from
# the GreenNode vLB / VKS documentation: without it the cloud may create a PUBLIC load balancer.
# This sample does not ship such an annotation because it has not been verified.
apiVersion: v1
kind: Service
metadata:
  name: stock-mcp-server
  namespace: stock-mcp
  labels:
    app: stock-mcp-server
spec:
  type: NodePort
  selector:
    app: stock-mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080   # default NodePort range: 30000-32767
      protocol: TCP
