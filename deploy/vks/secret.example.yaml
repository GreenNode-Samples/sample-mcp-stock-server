# EXAMPLE ONLY - never commit a real secret to git.
# Prefer creating the secret from the command line (nothing is written to a file):
#
#   kubectl -n stock-mcp create secret generic stock-mcp-secret \
#     --from-literal=MCP_API_KEYS="$(openssl rand -hex 32)"
#
# (Record the value so you can store the SAME key in AgentBase Access Control.)
# If you do use this file: copy it to secret.yaml (gitignored), replace the value, then apply it.
apiVersion: v1
kind: Secret
metadata:
  name: stock-mcp-secret
  namespace: stock-mcp
type: Opaque
stringData:
  # Several keys, comma-separated, allow rotation. The server rejects this placeholder and any key
  # shorter than 32 characters, so replace it (openssl rand -hex 32).
  MCP_API_KEYS: "change-me-run-openssl-rand-hex-32"
