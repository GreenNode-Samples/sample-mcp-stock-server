# ⚠️ CHỈ LÀ MẪU — KHÔNG commit secret thật vào git.
# Nên tạo secret bằng lệnh (không lưu ra file):
#
#   kubectl -n stock-mcp create secret generic stock-mcp-secret \
#     --from-literal=MCP_API_KEYS="$(openssl rand -hex 32)"
#
# (Ghi lại giá trị để lưu CÙNG key vào Access Control của AgentBase.)
# Nếu vẫn dùng file này: copy thành secret.yaml (đã nên .gitignore), thay giá trị rồi apply.
apiVersion: v1
kind: Secret
metadata:
  name: stock-mcp-secret
  namespace: stock-mcp
type: Opaque
stringData:
  # Nhiều key cách nhau bởi dấu phẩy (xoay vòng)
  MCP_API_KEYS: "<openssl rand -hex 32>"
