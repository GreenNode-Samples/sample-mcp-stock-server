apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-mcp-server
  namespace: stock-mcp
  labels:
    app: stock-mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-mcp-server
  template:
    metadata:
      labels:
        app: stock-mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # Image pushed to vCR (see the README: docker build / push). If the vCR repository is private,
          # create an imagePullSecret and uncomment imagePullSecrets below.
          image: vcr.vngcloud.vn/<repo>/stock-mcp-server:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: stock-mcp-secret   # holds MCP_API_KEYS
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The server only writes to memory (cache), never to disk.
            readOnlyRootFilesystem: true
      # imagePullSecrets:
      #   - name: vcr-pull-secret
