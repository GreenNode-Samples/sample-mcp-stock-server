# VN Stock MCP Server in the customer's on-prem data center.
#   cp .env.example .env     # set MCP_API_KEYS and BIND_ADDR (IP of the internal interface)
#   docker compose up -d --build
# The gateway (Private, 172.30.0.0/16) calls in over the VPN / Interconnect - see the README.
name: stock-mcp

services:
  mcp:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${MCP_IMAGE:-stock-mcp-server:local}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      # Bind only to the internal interface (BIND_ADDR), never to 0.0.0.0.
      - "${BIND_ADDR:?set BIND_ADDR=<internal IP> in .env}:${MCP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
