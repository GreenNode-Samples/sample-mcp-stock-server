# VN Stock MCP Server on a GreenNode vServer (inside the customer's VPC).
#
#   cp .env.example .env     # then set MCP_API_KEYS (see the comments in .env.example)
#   docker compose up -d --build        # HTTP on :8080, no TLS
#
# Optional TLS in front of it (Caddy, see docker-compose.tls.yml and README):
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# The build context is the repo root (../..) because the Dockerfile lives there.
name: stock-mcp

services:
  mcp:
    build:
      context: ../..
      dockerfile: Dockerfile
    # To use an image pushed to vCR, set MCP_IMAGE in .env, then `docker compose pull`.
    image: ${MCP_IMAGE:-stock-mcp-server:local}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      # The security group should only admit 172.30.0.0/16 to this port.
      # With the Caddy TLS override set BIND_ADDR=127.0.0.1 so this port is not exposed.
      - "${BIND_ADDR:-0.0.0.0}:${MCP_PORT:-8080}:8080"
    healthcheck:
      # healthcheck.py ships in the image and probes HOST:PORT (python: the slim image has no curl).
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
